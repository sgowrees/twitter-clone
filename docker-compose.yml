services:

  postgres:
    image: postgres:16
    container_name: twitter-clone-postgres
    environment:
      POSTGRES_DB: twitter_clone
      POSTGRES_USER: twitter_app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: twitter-clone-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    container_name: twitter-clone-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      # Two advertised listeners: one for other containers on this Docker
      # network (uses the service name "kafka" as hostname), one for
      # anything connecting from your host machine (localhost).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend:
    build: ./backend
    container_name: twitter-clone-backend
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/twitter_clone
      DB_USERNAME: twitter_app
      DB_PASSWORD: devpassword
      # "kafka" here is the service name above, resolved by Docker's internal
      # DNS - NOT localhost, and NOT the PLAINTEXT_HOST listener/port.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: CHANGE_ME_this_is_a_placeholder_secret_key_32chars_min

volumes:
  postgres_data: