services:

  db:
    image: postgres:16-alpine
    container_name: twitter-clone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: twitter_clone
      POSTGRES_USER: twitter_app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitter_app -d twitter_clone"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: twitter-clone-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: twitter-clone-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/twitter_clone
      SPRING_DATASOURCE_USERNAME: twitter_app
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: CHANGE_ME_this_is_a_placeholder_secret_key_32chars_min
      JWT_EXPIRATION_MS: 86400000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    image: nginx:alpine
    container_name: twitter-clone-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  newman:
    image: postman/newman:alpine
    container_name: twitter-clone-newman
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./tests/newman:/etc/newman:ro
    command:
      - run
      - /etc/newman/general.postman_collection.json
      - --env-var
      - baseUrl=http://backend:8080

volumes:
  postgres_data: