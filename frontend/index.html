<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="A lightweight Twitter clone" />
	<title>Chirp — share what matters</title>
	<style>
		:root { --blue:#1d9bf0; --ink:#0f1419; --muted:#536471; --line:#e6ecf0; --bg:#f7f9fa; --danger:#e0245e; }
		* { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; }
		button,input,textarea { font:inherit; } button { cursor:pointer; border:0; }
		.shell { display:grid; grid-template-columns:minmax(180px,250px) minmax(0,620px) minmax(220px,340px); gap:24px; max-width:1280px; margin:auto; padding:0 22px; }
		.sidebar { position:sticky; top:0; height:100vh; padding:22px 0; display:flex; flex-direction:column; } .brand { color:var(--blue); font-size:31px; font-weight:900; text-decoration:none; letter-spacing:-2px; margin:0 0 28px 12px; }
		.nav { display:grid; gap:7px; } .nav button { background:transparent; text-align:left; padding:12px 14px; border-radius:28px; color:var(--ink); font-size:17px; font-weight:650; } .nav button:hover { background:#e8f5fd; color:var(--blue); } .nav button span { display:inline-block; width:30px; font-size:20px; }
		.user-chip { margin-top:auto; display:flex; gap:10px; align-items:center; padding:12px; border-radius:32px; } .user-chip:hover { background:#eef1f2; } .user-meta { min-width:0; } .user-meta strong,.user-meta small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .user-meta small { color:var(--muted); }
		main { min-height:100vh; border-left:1px solid var(--line); border-right:1px solid var(--line); background:#fff; } .topbar { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--line); background:#ffffffeF; backdrop-filter:blur(10px); } .topbar h1 { font-size:20px; margin:0; } .icon-btn { background:transparent; font-size:20px; padding:5px; }
		.composer { padding:18px; border-bottom:1px solid var(--line); display:flex; gap:12px; } .composer-body { flex:1; } textarea { width:100%; border:0; outline:0; resize:vertical; min-height:68px; font-size:20px; padding:7px 0; color:var(--ink); } .composer-footer { display:flex; justify-content:space-between; align-items:center; } .counter { color:var(--muted); font-size:13px; } .counter.over { color:var(--danger); }
		.primary { border-radius:24px; padding:10px 20px; background:var(--blue); color:#fff; font-weight:750; } .primary:hover { filter:brightness(.9); } .primary:disabled { opacity:.5; cursor:not-allowed; } .secondary { padding:10px 18px; border-radius:22px; color:var(--ink); background:#eff3f4; font-weight:700; }
		.avatar { width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#8fd3ff,#7367f0); color:#fff; display:grid; place-items:center; flex:0 0 auto; font-weight:800; overflow:hidden; } .avatar img { width:100%; height:100%; object-fit:cover; }
		.feed-empty,.loading { text-align:center; color:var(--muted); padding:48px 20px; } .post { padding:18px; border-bottom:1px solid var(--line); display:flex; gap:12px; } .post:hover { background:#fcfdfe; } .post-content { min-width:0; flex:1; } .post-head { display:flex; align-items:center; gap:6px; } .post-head span { color:var(--muted); } .profile-link { display:flex; align-items:center; gap:6px; padding:0; background:transparent; text-align:left; } .profile-link:hover strong { color:var(--blue); } .profile-link span { color:var(--muted); } .post-text { white-space:pre-wrap; overflow-wrap:anywhere; font-size:16px; margin:5px 0 12px; } .post-actions { display:flex; justify-content:space-between; max-width:440px; color:var(--muted); } .action { background:transparent; color:inherit; padding:6px 10px 6px 0; } .action:hover,.action.liked { color:var(--danger); } .action.comment:hover { color:var(--blue); }
		.rightbar { padding-top:18px; } .search { display:flex; gap:8px; align-items:center; background:#eef1f2; border-radius:25px; padding:11px 16px; } .search input { width:100%; border:0; outline:0; background:transparent; } .search-results { margin-top:8px; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; } .user-result { display:flex; align-items:center; gap:9px; padding:10px; border-bottom:1px solid var(--line); } .user-result:last-child { border-bottom:0; } .user-result-info { min-width:0; flex:1; } .user-result-info strong,.user-result-info small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .user-result-info small { color:var(--muted); } .follow-btn { padding:6px 11px; border-radius:18px; background:var(--ink); color:#fff; font-size:12px; font-weight:700; } .follow-btn:hover { background:var(--blue); } .panel { margin-top:20px; background:#f5f8fa; border-radius:18px; padding:16px; } .panel h2 { font-size:19px; margin:0 0 14px; }
		.modal-backdrop { position:fixed; inset:0; display:grid; place-items:center; padding:20px; background:#0f141977; z-index:5; } .modal { width:min(440px,100%); background:#fff; border-radius:18px; padding:26px; box-shadow:0 12px 50px #0003; } .modal h2 { margin-top:0; } .form { display:grid; gap:13px; } .form label { display:block; color:var(--muted); font-size:13px; font-weight:650; } .form input { width:100%; padding:12px 13px; border:1px solid #cfd9de; border-radius:8px; outline:0; } .form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:5px; } .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#0f1419; color:#fff; padding:12px 18px; border-radius:8px; z-index:10; } .hidden { display:none !important; }
		.comments { margin-top:12px; border-top:1px solid var(--line); padding-top:8px; } .comments p { margin:8px 0; } .comments small { color:var(--muted); } .comment-form { display:flex; gap:8px; margin-top:10px; } .comment-form input { flex:1; border:1px solid var(--line); border-radius:20px; padding:8px 12px; }
		.profile-connections { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:20px; color:var(--muted); } .profile-connections strong { color:var(--ink); } .person-chip { background:#eef6fb; color:var(--blue); border-radius:16px; padding:5px 9px; margin:7px 5px 0 0; } .person-chip:hover { background:#d8eefb; }
		.profile-stats { display:flex; gap:28px; border-top:1px solid var(--line); margin-top:20px; padding-top:16px; } .profile-stats button,.profile-stats > span { display:flex; flex-direction:column; align-items:flex-start; background:transparent; color:var(--muted); padding:0; } .profile-stats button:hover strong { color:var(--blue); } .profile-stats strong { color:var(--ink); font-size:18px; } .connections-header { display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); } .connections-header h2 { margin:0; } .connections-list { padding:6px 18px; } .connection-card { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); } .connection-user { flex:1; min-width:0; background:transparent; text-align:left; padding:0; } .connection-user strong,.connection-user small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .connection-user small { color:var(--muted); } 
		@media (max-width:900px) { .shell { grid-template-columns:70px minmax(0,620px); max-width:690px; } .rightbar { display:none; } .brand { font-size:0; } .brand:after { content:'✦'; font-size:30px; } .nav button { font-size:0; text-align:center; } .nav button span { width:auto; font-size:22px; } .user-meta { display:none; } .user-chip { justify-content:center; } }
		@media (max-width:600px) { .shell { display:block; padding:0; } .sidebar { position:fixed; z-index:3; bottom:0; top:auto; height:58px; width:100%; background:#fff; border-top:1px solid var(--line); padding:3px 10px; } .brand,.user-chip { display:none; } .nav { display:flex; justify-content:space-around; } .nav button { padding:10px 16px; } main { border:0; padding-bottom:55px; } .composer { padding:13px; } }
	</style>
</head>
<body><div id="app"></div><div id="modal-root"></div><div id="toast-root"></div><script src="app.js" defer></script></body>
</html>
