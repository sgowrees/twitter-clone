name: Twitter Clone API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twitter_clone
          POSTGRES_USER: twitter_app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twitter_app -d twitter_clone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify PostgreSQL
        run: |
          echo "Checking PostgreSQL..."
          pg_isready -h localhost -p 5432 -U twitter_app -d twitter_clone

      - name: Verify Redis
        run: |
          echo "Checking Redis..."
          sudo apt-get update
          sudo apt-get install -y redis-tools
          redis-cli -h localhost -p 6379 ping

      - name: Build Spring Boot
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: CHANGE_ME_this_is_a_placeholder_secret_key_32chars_min
          JWT_EXPIRATION_MS: 86400000
        run: |
          mvn clean package -DskipTests

      - name: Start Spring Boot
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: CHANGE_ME_this_is_a_placeholder_secret_key_32chars_min
          JWT_EXPIRATION_MS: 86400000
        run: |
          echo "Starting Spring Boot..."

          nohup mvn spring-boot:run > spring.log 2>&1 &

          SPRING_PID=$!
          echo "Spring Boot PID: $SPRING_PID"

          echo "Waiting for Spring Boot..."

          for i in {1..90}; do

            if ! kill -0 $SPRING_PID 2>/dev/null; then
              echo "Spring Boot process stopped unexpectedly."
              echo "===== SPRING LOG ====="
              cat spring.log
              exit 1
            fi

            if curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Spring Boot is reachable!"
              break
            fi

            echo "Waiting... attempt $i/90"
            sleep 2

          done

          if ! curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "Spring Boot did not start."
            echo "===== SPRING LOG ====="
            cat spring.log
            exit 1
          fi

          echo "Spring Boot is ready!"

      - name: Show Spring Boot Health
        run: |
          curl -i http://localhost:8080/actuator/health

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        working-directory: tests/newman
        run: |
          newman run general.postman_collection.json

      - name: Show Spring Boot Logs
        if: always()
        working-directory: backend
        run: |
          echo "===== SPRING BOOT LOG ====="
          cat spring.log





