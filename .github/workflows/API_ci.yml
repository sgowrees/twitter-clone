name: Twitter Clone API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twitter_clone
          POSTGRES_USER: twitter_app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twitter_app -d twitter_clone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Spring Boot
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: CHANGE_ME_this_is_a_placeholder_secret_key_32chars_min
          JWT_EXPIRATION_MS: 86400000
        run: |
          mvn spring-boot:run > spring.log 2>&1 &

          echo "Waiting for Spring Boot..."

          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health)

            if [ "$STATUS" = "200" ]; then
              echo "Spring Boot is ready!"
              break
            fi

            echo "Spring Boot status: $STATUS"
            sleep 2
          done

          echo "Final health check:"
          curl -i http://localhost:8080/actuator/health

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        working-directory: tests/newman
        run: newman run general.postman_collection.json