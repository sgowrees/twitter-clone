name: CI Regression Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Start Docker services
        run: docker compose up -d postgres redis kafka

      - name: Wait for PostgreSQL
        run: |
          until docker compose exec -T postgres pg_isready -U twitter_app -d twitter_clone; do
            sleep 2
          done

      - name: Wait for Redis
        run: |
          until docker compose exec -T redis redis-cli ping | grep -q PONG; do
            sleep 2
          done

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if docker compose exec -T kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 \
              > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs kafka
          exit 1

      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Run unit and integration tests
        working-directory: ./backend
        run: ./mvnw test

      - name: Show Docker logs
        if: always()
        run: docker compose logs

      - name: Stop Docker services
        if: always()
        run: docker compose down -v

  api-regression-tests:
    name: API Regression Tests
    runs-on: ubuntu-latest

    needs:
      - unit-and-integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: |
          npm install -g newman
          newman --version

      - name: Start Docker application
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl --fail --silent \
              http://localhost:8080/actuator/health \
              > /dev/null 2>&1; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs backend
          exit 1

      - name: Verify Newman collection
        run: |
          if [ ! -f "tests/newman/general.postman_collection.json" ]; then
            echo "ERROR: Newman collection not found."
            find tests -maxdepth 3 -type f -print || true
            exit 1
          fi

      - name: Run Newman regression tests
        working-directory: ./tests/newman
        run: |
          newman run general.postman_collection.json \
            --reporters cli \
            --color on

      - name: Show Docker logs
        if: always()
        run: docker compose logs

      - name: Stop Docker application
        if: always()
        run: docker compose down -v

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest

    needs:
      - api-regression-tests

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Build production JAR
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      - name: Verify production JAR
        run: |
          JAR=$(find backend/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Production JAR not found."
            exit 1
          fi

          ls -lh "$JAR"