name: CI Regression Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

  POSTGRES_DB: twitter_clone
  POSTGRES_USER: twitter_app
  POSTGRES_PASSWORD: devpassword

  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
  SPRING_DATASOURCE_USERNAME: twitter_app
  SPRING_DATASOURCE_PASSWORD: devpassword
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

  SPRING_DATA_REDIS_HOST: localhost
  SPRING_DATA_REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  JWT_SECRET: ci-test-secret-key-32-characters-min
  JWT_EXPIRATION_MS: "86400000"

jobs:

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twitter_clone
          POSTGRES_USER: twitter_app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twitter_app -d twitter_clone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Start Kafka
        run: |
          docker run -d \
            --name kafka \
            -p 9092:9092 \
            apache/kafka:latest

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if docker exec kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 \
              > /dev/null 2>&1; then
              echo "Kafka is ready!"
              exit 0
            fi

            sleep 2
          done

          docker logs kafka
          exit 1

      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Run unit and integration tests
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: ci-test-secret-key-32-characters-min
          JWT_EXPIRATION_MS: "86400000"
        run: |
          ./mvnw test

      - name: Show Kafka logs
        if: always()
        run: docker logs kafka || true

      - name: Stop Kafka
        if: always()
        run: docker rm -f kafka || true


  api-regression-tests:
    name: API Regression Tests
    runs-on: ubuntu-latest

    needs:
      - unit-and-integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Newman
        run: |
          npm install -g newman
          newman --version

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Verify Newman collection
        run: |
          if [ ! -f "tests/newman/general.postman_collection.json" ]; then
            echo "ERROR: Newman collection not found."
            find tests -maxdepth 3 -type f -print || true
            exit 1
          fi

          ls -lh tests/newman/general.postman_collection.json

      - name: Start Docker Compose services
        run: |
          docker compose up -d --build

      - name: Show Docker Compose status
        run: |
          docker compose ps

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker compose exec -T postgres \
              pg_isready \
              -U twitter_app \
              -d twitter_clone \
              > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              exit 0
            fi

            echo "Waiting for PostgreSQL... $i/60"
            sleep 2
          done

          echo "PostgreSQL failed to start."
          docker compose logs postgres
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..60}; do
            if docker compose exec -T redis \
              redis-cli ping \
              | grep -q PONG; then
              echo "Redis is ready!"
              exit 0
            fi

            echo "Waiting for Redis... $i/60"
            sleep 2
          done

          echo "Redis failed to start."
          docker compose logs redis
          exit 1

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if docker compose exec -T kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafka:29092 \
              > /dev/null 2>&1; then
              echo "Kafka is ready!"
              exit 0
            fi

            echo "Waiting for Kafka... $i/60"
            sleep 2
          done

          echo "Kafka failed to start."
          docker compose logs kafka
          exit 1

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl --fail --silent \
              http://localhost:8080/actuator/health \
              > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi

            echo "Waiting for backend... $i/90"
            sleep 2
          done

          echo "Backend failed to start."
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Verify backend
        run: |
          curl -i \
            --max-time 10 \
            http://localhost:8080/actuator/health

      - name: Run Newman regression tests
        working-directory: ./tests/newman
        run: |
          newman run general.postman_collection.json \
            --reporters cli \
            --color on

      - name: Show Docker Compose logs
        if: always()
        run: |
          docker compose logs

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down -v


  build-production:
    name: Production Build
    runs-on: ubuntu-latest

    needs:
      - api-regression-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Build production JAR
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: ci-test-secret-key-32-characters-min
          JWT_EXPIRATION_MS: "86400000"
        run: |
          ./mvnw clean package -DskipTests

      - name: Verify production JAR
        run: |
          JAR=$(find backend/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Production JAR not found."
            exit 1
          fi

          ls -lh "$JAR"

      - name: Prepare production artifact
        run: |
          mkdir -p production

          JAR=$(find backend/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          cp "$JAR" production/twitter-clone.jar

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitter-clone-production
          path: production/twitter-clone.jar


  deploy-to-production:
    name: CD Deployment
    runs-on: ubuntu-latest

    needs:
      - build-production

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: twitter-clone-production
          path: production

      - name: Verify production artifact
        run: |
          ls -lh production/twitter-clone.jar

      - name: Verify Docker Compose
        run: |
          docker version
          docker compose version

      - name: Stop existing Docker Compose services
        run: |
          docker compose down || true

      - name: Start production infrastructure
        run: |
          docker compose up -d postgres redis kafka

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker compose exec -T postgres \
              pg_isready \
              -U twitter_app \
              -d twitter_clone \
              > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              exit 0
            fi

            echo "Waiting for PostgreSQL... $i/60"
            sleep 2
          done

          echo "PostgreSQL failed to start."
          docker compose logs postgres
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..60}; do
            if docker compose exec -T redis \
              redis-cli ping \
              | grep -q PONG; then
              echo "Redis is ready!"
              exit 0
            fi

            echo "Waiting for Redis... $i/60"
            sleep 2
          done

          echo "Redis failed to start."
          docker compose logs redis
          exit 1

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if docker compose exec -T kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server kafka:29092 \
              > /dev/null 2>&1; then
              echo "Kafka is ready!"
              exit 0
            fi

            echo "Waiting for Kafka... $i/60"
            sleep 2
          done

          echo "Kafka failed to start."
          docker compose logs kafka
          exit 1

      - name: Build backend Docker image
        run: |
          docker compose build backend

      - name: Start backend
        run: |
          docker compose up -d backend

      - name: Show Docker Compose status
        run: |
          docker compose ps

      - name: Wait for production backend
        run: |
          for i in {1..90}; do
            if curl --fail --silent \
              http://localhost:8080/actuator/health \
              > /dev/null 2>&1; then
              echo "Production backend is running!"
              exit 0
            fi

            echo "Waiting for production backend... $i/90"
            sleep 2
          done

          echo "Production backend failed to start."
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Verify production backend
        run: |
          curl -i \
            --max-time 10 \
            http://localhost:8080/actuator/health

      - name: Show production logs
        if: always()
        run: |
          docker compose logs backend
          docker compose logs postgres
          docker compose logs redis
          docker compose logs kafka

      - name: Show final Docker Compose status
        if: always()
        run: |
          docker compose ps