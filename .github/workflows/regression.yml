name: CI Regression Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

  POSTGRES_DB: twitter_clone
  POSTGRES_USER: twitter_app
  POSTGRES_PASSWORD: devpassword

  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
  SPRING_DATASOURCE_USERNAME: twitter_app
  SPRING_DATASOURCE_PASSWORD: devpassword
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

  SPRING_DATA_REDIS_HOST: localhost
  SPRING_DATA_REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  JWT_SECRET: ci-test-secret-key-32-characters-min
  JWT_EXPIRATION_MS: "86400000"

jobs:

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twitter_clone
          POSTGRES_USER: twitter_app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twitter_app -d twitter_clone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Start Kafka
        run: |
          docker run -d \
            --name kafka \
            -p 9092:9092 \
            apache/kafka:latest

      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka..."

          for i in {1..60}; do
            if docker exec kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 \
              > /dev/null 2>&1; then
              echo "Kafka is ready!"
              exit 0
            fi

            echo "Kafka not ready yet... $i/60"
            sleep 2
          done

          echo "Kafka failed to start."
          docker logs kafka
          exit 1

      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: |
          chmod +x mvnw

      - name: Run unit and integration tests
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: ci-test-secret-key-32-characters-min
          JWT_EXPIRATION_MS: "86400000"
        run: |
          ./mvnw test

      - name: Show Kafka logs
        if: always()
        run: |
          docker logs kafka || true

      - name: Stop Kafka
        if: always()
        run: |
          docker rm -f kafka || true


  api-regression-tests:
    name: API Regression Tests
    runs-on: ubuntu-latest

    needs:
      - unit-and-integration-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twitter_clone
          POSTGRES_USER: twitter_app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twitter_app -d twitter_clone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: |
          npm install -g newman
          newman --version

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Start Kafka
        run: |
          docker run -d \
            --name kafka \
            -p 9092:9092 \
            apache/kafka:latest

      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka..."

          for i in {1..60}; do
            if docker exec kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 \
              > /dev/null 2>&1; then
              echo "Kafka is ready!"
              exit 0
            fi

            echo "Kafka not ready yet... $i/60"
            sleep 2
          done

          echo "Kafka failed to start."
          docker logs kafka
          exit 1

      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: |
          chmod +x mvnw

      - name: Verify Newman collection
        run: |
          if [ ! -f "tests/newman/general.postman_collection.json" ]; then
            echo "ERROR: Newman collection not found."
            find tests -maxdepth 3 -type f -print || true
            exit 1
          fi

          ls -lh tests/newman/general.postman_collection.json

      - name: Build backend
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: ci-test-secret-key-32-characters-min
          JWT_EXPIRATION_MS: "86400000"
        run: |
          ./mvnw clean package -DskipTests

      - name: Start backend
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: ci-test-secret-key-32-characters-min
          JWT_EXPIRATION_MS: "86400000"
        run: |
          nohup ./mvnw spring-boot:run > spring.log 2>&1 &
          echo $! > spring.pid

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."

          for i in {1..90}; do
            if curl --fail --silent \
              http://localhost:8080/actuator/health \
              > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi

            echo "Waiting for backend... $i/90"

            if [ -f backend/spring.pid ]; then
              PID=$(cat backend/spring.pid)

              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Backend process stopped unexpectedly."
                cat backend/spring.log || true
                exit 1
              fi
            fi

            sleep 2
          done

          echo "Backend failed to start."
          cat backend/spring.log || true
          exit 1

      - name: Verify backend
        run: |
          curl -i \
            --max-time 10 \
            http://localhost:8080/actuator/health

      - name: Run Newman regression tests
        working-directory: ./tests/newman
        run: |
          newman run general.postman_collection.json \
            --reporters cli \
            --color on

      - name: Show backend logs
        if: always()
        run: |
          cat backend/spring.log || true

      - name: Show Kafka logs
        if: always()
        run: |
          docker logs kafka || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend/spring.pid ]; then
            kill "$(cat backend/spring.pid)" || true
          fi

      - name: Stop Kafka
        if: always()
        run: |
          docker rm -f kafka || true


  build-production:
    name: Production Build
    runs-on: ubuntu-latest

    needs:
      - api-regression-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: |
          chmod +x mvnw

      - name: Build production JAR
        working-directory: ./backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: ci-test-secret-key-32-characters-min
          JWT_EXPIRATION_MS: "86400000"
        run: |
          ./mvnw clean package -DskipTests

      - name: Verify production JAR
        run: |
          JAR=$(find backend/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Production JAR not found."
            exit 1
          fi

          ls -lh "$JAR"

      - name: Prepare production artifact
        run: |
          mkdir -p production

          JAR=$(find backend/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          cp "$JAR" production/twitter-clone.jar

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitter-clone-production
          path: production/twitter-clone.jar


  deploy-to-production:
    name: CD Deployment
    runs-on: ubuntu-latest

    needs:
      - build-production

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: twitter-clone-production
          path: production

      - name: Verify production artifact
        run: |
          ls -lh production/twitter-clone.jar

      - name: Start production application
        working-directory: ./production
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/twitter_clone
          SPRING_DATASOURCE_USERNAME: twitter_app
          SPRING_DATASOURCE_PASSWORD: devpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: ci-test-secret-key-32-characters-min
          JWT_EXPIRATION_MS: "86400000"
        run: |
          nohup java -jar twitter-clone.jar > production.log 2>&1 &
          echo $! > production.pid

      - name: Wait for production application
        run: |
          for i in {1..60}; do
            if curl --fail --silent \
              http://localhost:8080/actuator/health \
              > /dev/null 2>&1; then
              echo "Production application is running!"
              exit 0
            fi

            echo "Waiting for production application... $i/60"
            sleep 2
          done

          echo "Production application failed to start."
          cat production/production.log || true
          exit 1

      - name: Verify production application
        run: |
          curl -i \
            --max-time 10 \
            http://localhost:8080/actuator/health

      - name: Show production logs
        if: always()
        run: |
          cat production/production.log || true

      - name: Stop production application
        if: always()
        run: |
          if [ -f production/production.pid ]; then
            kill "$(cat production/production.pid)" || true
          fi