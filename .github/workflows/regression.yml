name: CI Regression Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker services
        run: |
          docker compose up -d postgres redis kafka
          docker compose ps

      - name: Wait for PostgreSQL
        run: |
          for i in {1..60}; do
            if docker compose exec -T postgres \
              pg_isready -U twitter_app -d twitter_clone \
              > /dev/null 2>&1; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            sleep 2
          done

          docker compose logs postgres
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..60}; do
            if docker compose exec -T redis \
              redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready."
              exit 0
            fi
            sleep 2
          done

          docker compose logs redis
          exit 1

      - name: Wait for Kafka
        run: |
          for i in {1..60}; do
            if docker compose exec -T kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 \
              > /dev/null 2>&1; then
              echo "Kafka is ready."
              exit 0
            fi
            sleep 2
          done

          docker compose logs kafka
          exit 1

      - name: Build backend image
        run: docker compose build backend

      - name: Run unit and integration tests
        run: |
          docker compose run --rm \
            -e DB_URL=jdbc:postgresql://postgres:5432/twitter_clone \
            -e DB_USERNAME=twitter_app \
            -e DB_PASSWORD=devpassword \
            -e KAFKA_BOOTSTRAP_SERVERS=kafka:29092 \
            -e REDIS_HOST=redis \
            -e REDIS_PORT=6379 \
            -e JWT_SECRET=ci-test-secret-key-32-characters-min \
            backend ./mvnw test

      - name: Show Docker logs
        if: always()
        run: docker compose logs

      - name: Stop Docker services
        if: always()
        run: docker compose down -v

  api-regression-tests:
    name: API Regression Tests
    runs-on: ubuntu-latest

    needs:
      - unit-and-integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: |
          npm install -g newman
          newman --version

      - name: Start Docker application
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl --fail --silent \
              http://localhost:8080/actuator/health \
              > /dev/null 2>&1; then
              echo "Backend is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Backend failed to start."
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Verify Newman collection
        run: |
          if [ ! -f "tests/newman/general.postman_collection.json" ]; then
            echo "ERROR: Newman collection not found."
            find tests -maxdepth 3 -type f -print || true
            exit 1
          fi

          ls -lh tests/newman/general.postman_collection.json

      - name: Run Newman regression tests
        working-directory: ./tests/newman
        run: |
          newman run general.postman_collection.json \
            --reporters cli \
            --color on

      - name: Show Docker logs
        if: always()
        run: docker compose logs

      - name: Stop Docker application
        if: always()
        run: docker compose down -v

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest

    needs:
      - api-regression-tests

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production image
        run: docker compose build backend

      - name: Verify Docker image
        run: |
          docker images
          docker compose config