name: CI Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run unit and integration tests
        working-directory: ./backend
        run: ./mvnw test

  api-regression-tests:
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: twitter_clone
          POSTGRES_USER: twitter_app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Kafka
        run: docker run -d --name kafka -p 9092:9092 apache/kafka:latest

      - name: Wait for Kafka
        run: sleep 15

      - name: Start backend
        working-directory: ./backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/twitter_clone
          DB_USERNAME: twitter_app
          DB_PASSWORD: devpassword
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_SECRET: ci-test-secret-key-32-characters-min
        run: |
          ./mvnw spring-boot:run &
          npx wait-on http://localhost:8080/actuator/health --timeout 60000

      - name: Run Newman API regression tests
        run: |
          npm install -g newman
          newman run tests/general.postman_collection.json


    