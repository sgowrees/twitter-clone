spring.application.name=twitter-clone

# PostgreSQL connection - update username/password/db name to match your local setup
spring.datasource.url=jdbc:postgresql://localhost:5432/twitter_clone
spring.datasource.username=twitter_app
spring.datasource.password=devpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=CHANGE_ME_this_is_a_placeholder_secret_key_32chars_min
jwt.expiration-ms=86400000


logging.level.org.springframework.security=DEBUG

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never